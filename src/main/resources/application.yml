spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: miniwsa
  jackson:
    deserialization:
      # Lets POST /v1/events/ingest take a bare event object as a one-event batch.
      accept-single-value-as-array: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/miniwsa}
    username: ${DATABASE_USER:miniwsa}
    password: ${DATABASE_PASSWORD:miniwsa}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast when Redis is down: the batch is then retried with backoff. The 60s default would
      # block each attempt (and the shutdown drain) for a minute. 10s leaves room for a full batch
      # (10,000 events = 20,000+ pipelined commands), which can take over 1s on Docker for Windows.
      timeout: 10s
      connect-timeout: 1s

miniwsa:
  queue:
    # Events held in memory between ingest and storage. They are lost if the process dies;
    # ingest answers 503 when a request doesn't fit.
    capacity: 100000
    batch-size: 10000
    poll-timeout: 500ms
    # A failed batch (PostgreSQL down) is retried with doubling waits, up to the max, until it succeeds.
    retry-initial-interval: 1s
    retry-max-interval: 30s
    # On shutdown, how long the worker gets to store what is still queued.
    shutdown-timeout: 10s
  samples:
    # A samples request (count plus one page) is cancelled in PostgreSQL after this long, so a broad
    # filter cannot hold a connection for long; the API then answers 503. Defaults to 5s if left out.
    query-timeout: 5s
  timeseries:
    # A timeseries request (one bucketed count over the window) is cancelled in PostgreSQL after this
    # long; the API then answers 503. Defaults to 5s if left out.
    query-timeout: 5s
  rate-limit:
    # Limits GET /v1/stats/** and /v1/events/samples per client IP; both share one budget, counted
    # in fixed windows. Each key defaults to the value here if left out.
    enabled: true
    limit: 100
    window: 1m

server:
  # Tomcat then resolves the real client IP (used by the rate limiter) from X-Forwarded-For, but only
  # when the direct peer is a trusted proxy; otherwise the header is ignored and the peer IP is used.
  forward-headers-strategy: native
  # Which peers count as trusted proxies. Set to your proxy's exact IP as a regex (e.g. 10\.0\.0\.5),
  # or to an empty pattern ("") when there is no proxy so X-Forwarded-For is never trusted. The default
  # trusts all private ranges, including the Docker bridge gateway 172.17.0.1.
  # tomcat:
  #   remoteip:
  #     internal-proxies: 10\.0\.0\.5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
