spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: miniwsa
  jackson:
    deserialization:
      # Lets POST /v1/events/ingest take a bare event object as a one-event batch.
      accept-single-value-as-array: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/miniwsa}
    username: ${DATABASE_USER:miniwsa}
    password: ${DATABASE_PASSWORD:miniwsa}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

miniwsa:
  queue:
    # Events held in memory between ingest and storage. They are lost if the process dies;
    # ingest answers 503 when a request doesn't fit.
    capacity: 100000
    batch-size: 500
    poll-timeout: 500ms
    # A failed batch (PostgreSQL down) is retried with doubling waits, up to the max, until it succeeds.
    retry-initial-interval: 1s
    retry-max-interval: 30s
    # On shutdown, how long the worker gets to store what is still queued.
    shutdown-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
