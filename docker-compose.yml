# Local dev infrastructure: PostgreSQL and Redis.
services:
  postgres:
    image: postgres:17
    container_name: miniwsa-postgres
    environment:
      POSTGRES_DB: miniwsa
      POSTGRES_USER: miniwsa
      POSTGRES_PASSWORD: miniwsa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniwsa -d miniwsa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4
    container_name: miniwsa-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:
